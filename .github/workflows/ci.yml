name: CI

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Check Go formatting
        run: |
          gofmt -w .
          git diff --exit-code -- '*.go'
      - name: Check module files
        run: go mod tidy -diff
      - name: Check for Go errors
        run: go vet ./...
      - name: Build and start the CLI
        run: |
          go build -o "$RUNNER_TEMP/kowloon" .
          "$RUNNER_TEMP/kowloon" --help
      - name: Run unit tests
        run: go test -race ./...
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Run tmux integration test
        env:
          KOWLOON_INTEGRATION: "1"
        run: go test -race -count=1 -run '^TestLiveWorkspace$' ./internal/app
