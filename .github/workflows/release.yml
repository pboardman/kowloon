name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Test the tagged commit
        env:
          KOWLOON_INTEGRATION: "1"
        run: go test -race ./...
      - name: Package binaries
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "$RUNNER_TEMP/kowloon" .
              archive="kowloon-${GITHUB_REF_NAME}-$os-$arch.tar.gz"
              tar -czf "$RUNNER_TEMP/assets/$archive" -C "$RUNNER_TEMP" kowloon
            done
          done
          cd "$RUNNER_TEMP/assets"
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/assets/* \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
